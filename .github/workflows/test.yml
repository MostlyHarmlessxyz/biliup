name: Test

on:
  push:
    branches:
      - master
      - refactor/rust_danmaku
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  npm-launcher:
    name: npm launcher tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test npm/tests/*.test.cjs
      - name: Frontend render and workbench logic tests
        run: |
          npm ci --no-audit --no-fund
          node --test app/lib/*.test.cjs

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # biliup-cli 通过 rust-embed 嵌入 out/ 前端产物，需要先构建
      - name: Build frontend
        run: |
          npm install
          npm run build
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check workspace formatting
        run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@v2
      # 媒体测试必须使用真实 FFmpeg 和与预览共用的中文字体；弹幕 XML -> ASS 已静态链接进 biliup，
      # 不再安装外部转换器。BILIUP_REQUIRE_RENDER_TESTS 让缺少字体时测试失败而不是跳过。
      # de_DE 让“逗号小数点 locale 被拒绝”的测试真正运行。
      - name: Install media test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg locales
          sudo locale-gen de_DE.UTF-8
          bash .github/scripts/build-render-tools.sh "$RUNNER_TEMP/render-tools"
          echo "BILIUP_RENDER_TOOLS_DIR=$RUNNER_TEMP/render-tools" >> "$GITHUB_ENV"
          echo "BILIUP_REQUIRE_RENDER_TESTS=1" >> "$GITHUB_ENV"
      - name: Run tests
        run: cargo test --locked --workspace

  # Rust 生产路径的三平台验收；以下 C oracle 作业保留至 Gate 6。
  danmaku-native:
    name: Native danmaku and worker (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      BILIUP_REQUIRE_LOCALE_TEST: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Build embedded frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install comma decimal locale
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          sudo locale-gen de_DE.UTF-8
          echo "BILIUP_REQUIRE_LOCALE_TEST=1" >> "$GITHUB_ENV"
      - name: Native core, transactions and compatibility
        run: cargo test --locked -p danmaku-factory
      - name: Real binary worker protocol and publication races
        run: cargo test --locked -p biliup-cli --test danmaku_worker
      - name: Real Python extension worker launcher
        run: cargo test --locked -p stream-gears --test danmaku_worker
      - name: Worker supervision, cancellation and recovery
        run: |
          cargo test --locked -p biliup-cli --lib server::workbench::renders::danmaku::tests
          cargo test --locked -p biliup-cli --lib server::workbench::renders::jobs::progress_tests::recovery
          cargo test --locked -p biliup-cli --lib server::workbench::renders::danmaku_directory
          cargo test --locked -p biliup-cli --lib server::workbench::renders::engine::danmaku_cleanup_tests
      - name: Native core static checks
        run: cargo clippy --locked -p danmaku-factory --all-targets -- -D warnings

  # 冻结 C 包装层的 ASan/UBSan/LSan 及符号检查（Gate 0–5 oracle）。
  danmaku-factory-sanitizers:
    name: DanmakuFactory core under sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run sanitizer checks
        run: CC=clang crates/danmaku-factory-sys/tests/c/check.sh

  # golden 语料必须能由固定提交的 DanmakuFactory CLI 重新生成：补丁版 CLI 写出期望结果，
  # 原版 CLI 除标记的上游缺陷用例外必须逐字节相同
  danmaku-factory-golden:
    name: DanmakuFactory golden corpus matches the CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned CLI, with and without biliup's patches
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcre2-dev pkg-config
          commit=$(sed -n 's/^DANMAKU_FACTORY_COMMIT="\(.*\)"$/\1/p' crates/danmaku-factory-sys/scripts/vendor.sh)
          git clone --quiet https://github.com/hihkm/DanmakuFactory.git "$RUNNER_TEMP/df"
          build() {
            mkdir -p "$RUNNER_TEMP/$1"
            mapfile -d '' sources < <(find "$RUNNER_TEMP/df/src" -type f -name '*.c' -print0)
            read -r -a pcre <<< "$(pkg-config --cflags --libs libpcre2-8)"
            cc -std=gnu11 -O2 "${sources[@]}" "${pcre[@]}" -lm -o "$RUNNER_TEMP/$1/DanmakuFactory"
          }
          git -C "$RUNNER_TEMP/df" checkout --quiet "$commit"
          build upstream
          git -C "$RUNNER_TEMP/df" apply "$GITHUB_WORKSPACE"/crates/danmaku-factory-sys/patches/*.patch
          build patched
      - name: Regenerate the corpus
        run: |
          python3 -I crates/danmaku-factory/tests/golden/generate.py \
            --cli "$RUNNER_TEMP/patched/DanmakuFactory" --upstream-cli "$RUNNER_TEMP/upstream/DanmakuFactory"
          git diff --exit-code -- crates/danmaku-factory/tests/golden

  # 桌面程序是独立 workspace，依赖变动时根 Cargo.lock 会更新，它的锁不会跟着变；
  # desktop-publish.yml 只在发版时跑，漂移要到那时才暴露（v1.2.9 就是这样）
  desktop-lockfile:
    name: Desktop Cargo.lock up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: cargo metadata --locked
        run: cargo metadata --locked --format-version 1 --manifest-path tauri-app/src-tauri/Cargo.toml > /dev/null
